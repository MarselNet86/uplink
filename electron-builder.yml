appId: dev.daimon.uplink
productName: Uplink
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
# No ${version} on purpose: the README links to
# releases/latest/download/<name>, which only works while the file name stays
# the same across releases. Also drops the spaces electron-builder puts in the
# default NSIS name ("Uplink Setup 1.0.0.exe"), which do not belong in a URL.
artifactName: ${productName}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Network
npmRebuild: false
