name: ci

on:
  push:
    branches: [main]
    # Release artifacts are cut from tags, so the tag push has to reach this
    # workflow too - `branches:` alone would silently skip it.
    tags: ['v*']
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit --omit=dev

  build:
    needs: lint-typecheck-test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      # No platform flag: each runner builds its own targets from
      # electron-builder.yml, which is the whole point of the matrix.
      - run: npx electron-builder --publish never

      # Only on push, not on pull_request: a PR build still has to prove it
      # compiles, but three OSes worth of installers per PR is ~650 MB of
      # storage for something nobody downloads.
      #
      # `.blockmap` files are left out - they only serve differential
      # auto-updates, which this app does not do.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          # upload-artifact@v4 refuses duplicate names across a matrix, so the
          # runner OS has to be part of it.
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    # Tags only. A plain push to main still publishes artifacts above; this
    # job is what turns a tag into a downloadable GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The default token is read-only; creating a release needs write.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The builds are unsigned (no Apple Developer ID, no Windows code
      # signing certificate), so a published checksum is the only way for
      # someone to verify they downloaded what was actually built here.
      - name: Generate checksums
        run: cd dist && sha256sum *.dmg *.zip *.exe *.AppImage *.deb > SHA256SUMS

      # `gh` is preinstalled on the runner - no third-party action is given
      # the release token.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
